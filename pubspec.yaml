name: simrs_dokter
description: "Aplikasi Mobile E-Dokter"
publish_to: 'none'
version: 1.3.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0

  # State Management
  get: ^4.6.6

  # HTTP & Networking
  dio: ^5.7.0
  connectivity_plus: ^7.1.1

  # Storage & Auth
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.2

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  awesome_notifications: ^0.12.1
  device_info_plus: ^13.2.0
  path_provider: ^2.1.5
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - shorebird.yaml

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21
